services:
  backend:
    build:
      context: ./backend
    container_name: linh-voice-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        host_ip: 127.0.0.1
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: linh-voice-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - target: 80
        published: 8080
        protocol: tcp
        host_ip: 127.0.0.1

  postgres:
    image: postgres:16-alpine
    container_name: linh-voice-postgres
    restart: unless-stopped
    profiles:
      - local-db
    environment:
      POSTGRES_DB: linh_voice
      POSTGRES_USER: linh_voice
      POSTGRES_PASSWORD: linh_voice
    ports:
      - "5432:5432"
    volumes:
      - linh_voice_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linh_voice -d linh_voice"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  linh_voice_postgres_data:
